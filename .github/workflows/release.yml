name: Release

# Build the exporter and publish the compiled binary to a GitHub Release
# whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build linux/amd64 binary
        working-directory: ./src
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o tronscan-exporter-linux-amd64 .

      - name: Publish release with binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            src/tronscan-exporter-linux-amd64 \
            --title "${GITHUB_REF_NAME}" \
            --notes "TRON Prometheus exporter — automated build for ${GITHUB_REF_NAME}. Exposes tron_current_tps, tron_max_tps and tron_blockHeight on :8091/metrics." \
            --repo "${GITHUB_REPOSITORY}"
