name: Release

# Build the exporter and publish the compiled binary to a GitHub Release.
# Runs either when a version tag (v*) is pushed, or on manual dispatch with a
# tag name (the job creates the tag + release itself in that case).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build linux/amd64 binary
        working-directory: ./src
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o tronscan-exporter-linux-amd64 .

      - name: Compress binary with UPX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --best --lzma src/tronscan-exporter-linux-amd64
          ls -la src/tronscan-exporter-linux-amd64

      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        id: deb
        env:
          SERVICENAME: tronscan-exporter
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          export SERVICENAME VERSION
          mkdir -p "ci/deb/becreator/${SERVICENAME}"
          cp src/tronscan-exporter-linux-amd64 "ci/deb/becreator/${SERVICENAME}/${SERVICENAME}"
          chmod 755 "ci/deb/becreator/${SERVICENAME}/${SERVICENAME}" ci/deb.sh
          ./ci/deb.sh
          DEB="${SERVICENAME}_${VERSION}_amd64.deb"
          mv "ci/${SERVICENAME}.deb" "$DEB"
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          dpkg-deb -I "$DEB"

      - name: Publish release with binary and .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" src/tronscan-exporter-linux-amd64 "$DEB" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" src/tronscan-exporter-linux-amd64 "$DEB" \
              --title "$TAG" \
              --notes "TRON Prometheus exporter — automated build for $TAG. Exposes tron_current_tps, tron_max_tps, tron_block_height and tron_up on :8091/metrics. Assets: UPX-compressed linux/amd64 binary and a Debian package (installs a systemd service running from /becreator/tronscan-exporter)." \
              --target main \
              --repo "$GITHUB_REPOSITORY"
          fi
